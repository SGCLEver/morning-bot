name: Проверка почты

# Запускается кнопкой «✉️ Проверить почту» в меню бота (через Cloudflare Worker).
on:
  workflow_dispatch:

concurrency:
  group: mail
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Почта
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TODOIST_TOKEN: ${{ secrets.TODOIST_TOKEN }}
          MAILRU_EMAIL: ${{ secrets.MAILRU_EMAIL }}
          MAILRU_APP_PASSWORD: ${{ secrets.MAILRU_APP_PASSWORD }}
          MAIL_VIP: ${{ vars.MAIL_VIP }}
          MAIL_BLOCK: ${{ vars.MAIL_BLOCK }}
          MAIL_KEYWORDS: ${{ vars.MAIL_KEYWORDS }}
        run: python bot.py mail
