name: Вечерний итог

on:
  schedule:
    # GitHub запускает расписание с опозданием до 10-30 минут, поэтому
    # стартуем в 21:40 по Уфе (UTC+5), а бот сам ждёт ровно 22:00
    - cron: "40 16 * * *"
  workflow_dispatch:

concurrency:
  group: bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 200    # ждёт нажатия кнопки до полуночи
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Итог дня
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TODOIST_TOKEN: ${{ secrets.TODOIST_TOKEN }}
          EVENING_AT: "22:00"
          NO_WAIT: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: python bot.py evening
